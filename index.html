<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RubberFlow" />
    <meta name="description" content="Mobile-first PWA for rubber estate & business accounting, daily sales, worker wages, and dues tracker." />
    
    <title>RubberFlow Mobile — Rubber Estate & Business Accounting</title>
    
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Import map fallback for static servers (like VS Code Live Server on port 5500) -->
    <script type="importmap">
    {
      "imports": {
        "chart.js": "https://cdn.jsdelivr.net/npm/chart.js@4.4.8/+esm",
        "xlsx": "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm"
      }
    }
    </script>

    <!-- Tailwind CDN fallback when not compiled by Vite (e.g. Live Server port 5500) -->
    <script>
      if (window.location.port === '5500' || window.location.protocol === 'file:') {
        const twScript = document.createElement('script');
        twScript.src = 'https://cdn.tailwindcss.com';
        document.head.appendChild(twScript);
      }
    </script>

    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#f1f3f5] text-slate-900 antialiased selection:bg-slate-900 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <!-- Pure Plain JavaScript Entry (Zero JSX, Zero TypeScript) -->
    <script type="module" src="/src/app.js"></script>

    <script>
      // Fallback guide if opened via static server (Live Server port 5500) where Vite is not running
      window.addEventListener('error', function(e) {
        const root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = `
            <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: #f8fafc;">
              <div style="max-width: 480px; width: 100%; background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; text-align: center;">
                <div style="width: 56px; height: 56px; border-radius: 16px; background: #fef3c7; color: #b45309; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 16px;">⚡</div>
                <h2 style="font-size: 18px; font-weight: 800; color: #0f172a; margin: 0 0 8px;">Run with Vite Dev Server</h2>
                <p style="font-size: 13px; color: #64748b; line-height: 1.6; margin: 0 0 20px;">
                  RubberFlow uses <strong>Vite</strong> and modern ES modules. Running directly via VS Code Live Server (port 5500) bypasses the Vite compiler.
                </p>
                <div style="background: #0f172a; color: #f8fafc; border-radius: 14px; padding: 14px 16px; font-family: monospace; font-size: 13px; text-align: left; margin-bottom: 20px; line-height: 1.8;">
                  <div style="color: #94a3b8;"># In your terminal (VS Code):</div>
                  <div style="color: #38bdf8; font-weight: bold;">npm run dev</div>
                  <div style="margin-top: 6px; color: #94a3b8;"># Then open in browser:</div>
                  <div style="color: #4ade80;">http://localhost:3000</div>
                </div>
                <a href="http://localhost:3000" style="display: block; width: 100%; padding: 12px; border-radius: 12px; background: #0f172a; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 13px; box-sizing: border-box;">
                  Go to http://localhost:3000
                </a>
              </div>
            </div>
          `;
        }
      });

      // Register Progressive Web App Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('RubberFlow PWA ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.warn('PWA ServiceWorker registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
