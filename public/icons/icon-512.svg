<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Rubber Leaf / Branch Graphic -->
  <g transform="translate(60, 40) scale(0.78)" filter="url(#glow)">
    <!-- Main leaf body -->
    <path d="M256 60 C380 60 440 180 430 330 C340 370 230 330 180 270 C140 220 160 110 256 60 Z" fill="url(#leafGrad)" />
    <!-- Leaf vein -->
    <path d="M256 60 Q270 210 390 320" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
    <path d="M265 150 Q310 180 360 170" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" />
    <path d="M278 210 Q340 240 380 230" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" />

    <!-- Pure Latex Droplet / Coin -->
    <path d="M190 310 C190 260 250 200 250 200 C250 200 310 260 310 310 C310 345 285 375 250 375 C215 375 190 345 190 310 Z" fill="url(#dropGrad)" />
    <!-- Droplet gloss reflection -->
    <ellipse cx="235" cy="295" rx="14" ry="26" transform="rotate(-30 235 295)" fill="rgba(255,255,255,0.45)" />

    <!-- Rupee symbol inside latex coin -->
    <text x="250" y="325" font-family="'JetBrains Mono', 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">₹</text>
  </g>

  <!-- Flow rings -->
  <circle cx="256" cy="430" r="14" fill="#10b981" />
  <circle cx="216" cy="430" r="8" fill="#3b82f6" opacity="0.8" />
  <circle cx="296" cy="430" r="8" fill="#f59e0b" opacity="0.8" />
</svg>
